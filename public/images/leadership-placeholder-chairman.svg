<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#15203b" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c07b" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c59b27" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <rect width="400" height="450" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="140" fill="url(#aura)" />
  
  <!-- Subtle decorative grid -->
  <circle cx="200" cy="170" r="110" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="200" cy="170" r="120" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" opacity="0.4"/>

  <!-- Stylized Executive Female Silhouette (Chairman) -->
  <g fill="#94a3b8" opacity="0.85">
    <!-- Head -->
    <ellipse cx="200" cy="155" rx="38" ry="46" fill="#cbd5e1" />
    <!-- Hair style contour -->
    <path d="M 155 160 C 152 110, 248 110, 245 160 C 242 185, 235 205, 235 210 C 230 195, 225 155, 200 155 C 175 155, 170 195, 165 210 C 165 205, 158 185, 155 160 Z" fill="#475569" />
    <!-- Neck -->
    <path d="M 188 198 L 212 198 L 216 226 L 184 226 Z" fill="#cbd5e1" />
    <!-- Executive Collar & Blazer -->
    <path d="M 120 330 C 120 255, 150 230, 184 226 L 200 270 L 216 226 C 250 230, 280 255, 280 330 Z" fill="#1e293b" />
    <path d="M 184 226 L 200 270 L 216 226 L 208 245 L 200 250 L 192 245 Z" fill="#f8fafc" />
    <!-- Executive Lapels -->
    <path d="M 160 235 L 195 295 L 185 330 L 135 330 Z" fill="#334155" />
    <path d="M 240 235 L 205 295 L 215 330 L 265 330 Z" fill="#334155" />
  </g>
  
  <!-- Subtle Badge Pin -->
  <circle cx="170" cy="275" r="4" fill="url(#goldAccent)" />
  
  <!-- Text Label -->
  <rect x="70" y="375" width="260" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="200" y="398" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">OFFICIAL EXECUTIVE PORTRAIT</text>
</svg>
